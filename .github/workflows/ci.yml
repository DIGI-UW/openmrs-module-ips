name: CI

on:
  push:
    branches: [ main, "1.x" ]
  pull_request:
    branches: [ main, "1.x" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots clean install -DskipTests
